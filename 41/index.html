<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <form>
            <legend>
                Ваши личные данные
            </legend>
            <label>
                Имя
                <input type="text" name="name" placeholder="Имя" required>
            </label>
            <label>
                Возраст
                <input type="number" inputmode="numeric" name="age" placeholder="Возраст" required>
            </label>
            <label>
                Номер телефона
                <input type="tel" name="tel" placeholder="Tel number" required>
            </label>
            <label>
                Почта
                <input type="email" name="email" placeholder="Почта" required>
            </label>
            <label>
            Сообщение
                <textarea name="message" placeholder="Сообщение" required></textarea>
            </label>
            <br>
            <label>
                <input type="checkbox">
                Я принимаю правила
            </label>
            <button>
                SEND
            </button>
    </form>
</body>
</html>
