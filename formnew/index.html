<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/normalize.css">
</head>
<body>
    <form>
            <legend class="legend">
                Ваши личные данные
            </legend>
            <label>
                Имя
                <input class="input" type="text" name="name" placeholder="Имя" required>
            </label>
            <label>
                Возраст
                <input class="input" type="number" inputmode="numeric" name="age" placeholder="Возраст" required>
            </label>
            <label>
                Номер телефона
                <input class="input" type="tel" name="tel" placeholder="Tel number" required>
            </label>
            <label>
                Почта
                <input class="input" type="email" name="email" placeholder="Почта" required>
            </label>
            <label>
            Сообщение
                <textarea class="textarea" name="message" placeholder="Сообщение" required></textarea>
            </label>
            <br>
            <label class="checkbox-label">
                <input type="checkbox" class="checkbox">
                <span class="checkbox-text">Я принимаю правила</span>
            </label>
            <button class="button">
                Отправить
            </button>
    </form>
</body>
</html>
